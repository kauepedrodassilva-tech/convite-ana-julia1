<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel — Ana Júlia</title><link rel="stylesheet" href="/css/style.css"></head><body class="admin-body"><main class="admin-main"><section class="panel admin-login" id="loginPanel"><p class="eyebrow">ÁREA RESTRITA</p><h1 class="script section-title">Painel da Ana</h1><form id="loginForm"><label>E-mail</label><input id="email" type="email" required value="admin@convite.local"><label>Senha</label><input id="password" type="password" required><button class="btn full">Entrar</button><p id="loginMsg" class="status"></p><small>Credenciais iniciais estão no README. Troque-as antes de publicar.</small></form></section><section id="adminApp" hidden><header class="admin-header"><h1 class="script section-title">Painel da Ana</h1><button id="logoutBtn" class="btn light">Sair</button></header><div id="stats" class="stats"></div><section class="panel admin-section"><h2>Confirmações</h2><div class="filters"><input id="searchGuest" placeholder="Buscar nome"><select id="filterAttendance"><option value="">Todas</option><option value="yes">Vão</option><option value="no">Não vão</option></select><button id="exportBtn" class="btn">Exportar CSV</button></div><div class="table-wrap"><table><thead><tr><th>Nome</th><th>Presença</th><th>Pessoas</th><th>Mensagem</th><th>Presente</th><th>Data</th><th></th></tr></thead><tbody id="guestRows"></tbody></table></div></section><section class="panel admin-section" id="giftsSection"><h2>Lista de presentes</h2><form id="giftForm" class="gift-form"><div><label for="giftName">Nome do presente</label><input id="giftName" required maxlength="120"></div><div><label for="giftBuyUrl">Link de compra (opcional)</label><input id="giftBuyUrl" type="text" inputmode="url" maxlength="500" placeholder="https://loja.com/produto"></div><div class="wide"><label for="giftDesc">Descrição (opcional)</label><textarea id="giftDesc" rows="2" maxlength="300"></textarea></div><div class="wide"><label for="giftImageUrl">Ou use o link de uma imagem (opcional)</label><input id="giftImageUrl" placeholder="https://… (alternativa ao envio de arquivo)"></div><div class="wide img-row"><img id="giftThumb" class="thumb thumb-empty" alt="" hidden><div><label for="giftFile">Foto do presente (PNG, JPG ou WebP)</label><input id="giftFile" type="file" accept="image/png,image/jpeg,image/webp"></div><button type="button" class="btn light" id="giftImgClear" hidden>Remover imagem</button></div><div class="wide status-note" id="giftAvail" hidden></div><div class="wide"><button class="btn" id="giftSubmit">Adicionar presente</button><button type="button" class="btn light" id="giftCancel" hidden>Cancelar edição</button></div><p id="giftFormMsg" class="status wide"></p></form><div class="table-wrap"><table class="gift-table"><thead><tr><th></th><th>Presente</th><th>Link de compra</th><th>Situação</th><th>Escolhido por</th><th>Ações</th></tr></thead><tbody id="giftRows"></tbody></table></div></section><section class="panel admin-section"><h2>Configurações do convite</h2><form id="settingsForm" class="settings-grid"><div><label>Nome do evento</label><input id="eventName" required></div><div><label>Data e hora</label><input id="eventDate" type="datetime-local" required></div><div><label>Endereço</label><input id="address"></div><div><label>Link do mapa</label><input id="mapsUrl" type="url"></div><div><label>URL da música (MP3/áudio)</label><input id="musicUrl" type="url"></div><div><label>URL da imagem (opcional)</label><input id="heroImage" type="url"></div><div><label>E-mail do painel</label><input id="adminEmail" type="email" required></div><div class="checks"><label><input id="rsvpEnabled" type="checkbox"> Confirmações abertas</label><label><input id="reservationsEnabled" type="checkbox"> Escolha de presentes aberta</label></div><button class="btn">Salvar configurações</button><p id="settingsMsg" class="status"></p></form></section></section></main><script src="/js/admin.js" defer></script></body></html>
